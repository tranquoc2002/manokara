<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Your karaoke studio. Build a setlist, sing along, and send synchronized lyrics to OBS.">
<title>Manokara — your karaoke studio</title>
<link rel="icon" href="./manokara.ico">
<link rel="preload" href="./ui-assets/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./ui-assets/geist.css">
<link rel="stylesheet" href="./manokara-ui.css">
<link rel="stylesheet" href="./manokara-tour.css">
<link rel="stylesheet" href="./manokara-search.css">
<link rel="stylesheet" href="./manokara-studio.css">
<link rel="stylesheet" href="./manokara-pitch.css">
<link rel="stylesheet" href="./manokara-playlist.css">
</head>
<body>
<a class="skip-link" href="#grid">Skip to studio</a>
<header class="app-header"><div id="appHeaderReactRoot"></div></header>
<nav class="main-tabs" aria-label="Main workspace"><div id="mainTabsReactRoot"></div></nav>
<div id="transposeDialogReactRoot"></div>
<div id="tourReactRoot"></div>
<div id="warn" hidden><b>Open Manokara through its configured server URL.</b> The lyric relay requires the Python server. See DEPLOY.md for setup.</div>
<div id="karaokeReactRoot"></div>
<dialog id="songEditorDialog" class="studio-dialog" aria-labelledby="songDialogTitle"><div id="songEditorReactRoot"></div></dialog>
<dialog id="libraryDialog" class="studio-dialog library-dialog" aria-labelledby="libraryTitle"><div id="libraryDialogReactRoot"></div></dialog>
<section id="playlistStudio" role="tabpanel" aria-labelledby="main-playlist" hidden><div id="studioReactHeader"></div><div id="studioReactLayoutRoot"></div></section>
<footer id="appFooterReactRoot" class="app-footer"></footer>

<script src="./manokara-pitch.js"></script>
<script type="module" src="./manokara-react.js"></script>

</body>
</html>
