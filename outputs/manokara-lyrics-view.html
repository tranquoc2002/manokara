<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manokara OBS Lyrics</title>
<link rel="icon" href="./manokara.ico">
<link rel="stylesheet" href="./manokara-effects.css?v=2">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color-scheme:light}
body{background:transparent;color:#fff;font:800 64px/1.15 system-ui,"Yu Gothic",sans-serif;text-align:center;text-shadow:0 0 6px #000,0 0 6px #000}
#out{height:100%;width:100%;padding:0 4%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.4em}
#previous{font-size:.55em;opacity:.55}
#current{font-size:1em;overflow-wrap:anywhere;max-width:100%}#previous{max-width:100%;overflow-wrap:anywhere}.fx-word{max-width:100%;white-space:normal;overflow-wrap:anywhere}
#count{font-size:1.5em;line-height:1}
body[data-center-free="on"] #out{padding:0}
body[data-center-free="on"][data-center-shape="wide"] #current,body[data-center-free="on"][data-center-shape="wide"] #previous{position:fixed;z-index:5;top:0;height:100vh;width:36vw;max-width:36vw;padding:2vw;display:block;align-content:center;text-align:center;overflow:hidden;overflow-wrap:anywhere}
body[data-center-free="on"][data-center-shape="wide"] #current[data-zone="left"],body[data-center-free="on"][data-center-shape="wide"] #previous[data-zone="left"]{left:0;right:auto}
body[data-center-free="on"][data-center-shape="wide"] #current[data-zone="right"],body[data-center-free="on"][data-center-shape="wide"] #previous[data-zone="right"]{right:0;left:auto}
body[data-center-free="on"][data-center-shape="tall"] #current,body[data-center-free="on"][data-center-shape="tall"] #previous{position:fixed;z-index:5;left:0;width:100vw;height:33vh;padding:2vh 4vw;display:block;align-content:center;text-align:center;overflow:hidden;overflow-wrap:anywhere}
body[data-center-free="on"][data-center-shape="tall"] #current[data-zone="top"],body[data-center-free="on"][data-center-shape="tall"] #previous[data-zone="top"]{top:0;bottom:auto}
body[data-center-free="on"][data-center-shape="tall"] #current[data-zone="bottom"],body[data-center-free="on"][data-center-shape="tall"] #previous[data-zone="bottom"]{bottom:0;top:auto}
#jizuraCanvas{position:fixed;inset:0;z-index:2;width:100vw;height:100vh;display:none}
body[data-jizura="on"] #out{display:none}
#foliaFrame{position:fixed;inset:0;z-index:3;width:100vw;height:100vh;border:0;display:none;background:transparent}
body[data-folia="on"] #out,body[data-folia="on"] #jizuraCanvas{display:none!important}
body[data-folia="on"] #foliaFrame{display:block}
#romajiCaption{position:fixed;z-index:30;left:6vw;bottom:5vh;width:88vw;max-width:88vw;pointer-events:none;text-align:center;overflow-wrap:anywhere;line-height:1.3;font-weight:600;text-shadow:0 1px 4px #000,0 0 8px #000}
#romajiCaption[hidden]{display:none!important}
body[data-center-free="on"][data-center-shape="wide"] #romajiCaption{width:32vw;max-width:32vw;bottom:6vh;left:2vw}
body[data-center-free="on"][data-center-shape="wide"] #romajiCaption[data-zone="right"]{left:auto;right:2vw}
body[data-center-free="on"][data-center-shape="tall"] #romajiCaption{left:4vw;width:92vw;max-width:92vw;bottom:5vh}
body[data-center-free="on"][data-center-shape="tall"] #romajiCaption[data-zone="top"]{bottom:auto;top:24vh}
</style>
</head>
<body><main id="out"><div id="previous"></div><div id="current"></div><div id="count"></div></main><canvas id="jizuraCanvas"></canvas><iframe id="foliaFrame" title="Folia lyric visualizer" allow="autoplay"></iframe><div id="romajiCaption" hidden></div>
<script src="./manokara-core.js"></script>
<script src="./manokara-relay.js"></script>
<script src="./manokara-effects.js?v=2"></script>
<script src="./manokara-jizura.js?v=full"></script>
<script src="./manokara-jizura-adapter.js?v=random-style-1"></script>
<script>
const $=s=>document.querySelector(s);
const jizuraCanvas=$('#jizuraCanvas');
const foliaFrame=$('#foliaFrame');
const themes={white:{color:'#FFFFFF',filter:'grayscale(1) brightness(1.12)'},cyan:{color:'#67E8F9',filter:'sepia(1) saturate(3.4) hue-rotate(145deg)'},rose:{color:'#FDA4AF',filter:'sepia(1) saturate(3.2) hue-rotate(320deg)'},amber:{color:'#FCD34D',filter:'sepia(1) saturate(3.8) hue-rotate(350deg)'},violet:{color:'#C4B5FD',filter:'sepia(1) saturate(4) hue-rotate(230deg)'},mint:{color:'#6EE7B7',filter:'sepia(1) saturate(3.2) hue-rotate(105deg)'}};
const relayRoom=new URL(location.href).searchParams.get('room')||'';
const relayViewToken=new URLSearchParams(location.hash.slice(1)).get('view')||'';
window.addEventListener('hashchange',()=>location.reload());
const relayStateUrl=()=>{const url=new URL('/__lyric-state',location.href);if(relayRoom)url.searchParams.set('room',relayRoom);return url.href};
const clock=ManokaraCore.createClock(),subscribers=new Set();
let state=null,parsedKey='',lines=[],secondaryLines=[],lastTextKey='',captionKey='',sceneKey='',foliaLayoutKey='',directAt=-Infinity,viewerRevoked=false;
window.ManokaraOutput={room:relayRoom,time:()=>clock.time(),getSnapshot:()=>state,audio:()=>state?.playing&&!state.paused&&clock.age()<1000?state:null,subscribe(fn){subscribers.add(fn);if(state)fn(state);return()=>subscribers.delete(fn)}};
function notify(){for(const fn of subscribers)fn(state)}
function googleFontHref(value){
 const [family,...parts]=String(value||'').split(':');
 const name=family.trim(),variant=parts.join(':');
 if(!name||variant&&!/^[\w;@_-]+$/.test(variant))return'';
 return 'https://fonts.googleapis.com/css2?family='+encodeURIComponent(name).replace(/%20/g,'+')+(variant?':'+variant:'')+'&display=swap';
}
function syncFont(s,doc=document){
 const href=googleFontHref(s.googleFont),old=doc.getElementById('manokara-google-font');
 if(!href){if(old)old.remove();return}
 if(old&&old.getAttribute('href')===href)return;
 const link=old||doc.createElement('link');link.id='manokara-google-font';link.rel='stylesheet';link.href=href;
 if(!old)doc.head.appendChild(link);
}
function centerShape(s){const m=s.centerShape||'auto';return m==='auto'?(innerHeight>innerWidth*1.1?'tall':'wide'):m}
function lineState(s){
 if(s.counting||s.mc||!s.title)return{current:'',previous:'',romaji:'',index:0};
 const key=(s.lrc||'')+'|'+(s.romajiLrc||'')+'|'+s.duration;
 if(key!==parsedKey){parsedKey=key;lines=parseLyrics(s.lrc,s.duration);secondaryLines=s.romajiLrc?parseLyrics(s.romajiLrc,s.duration):[]}
 const t=clock.time();
 let low=0,high=lines.length;while(low<high){const mid=(low+high)>>>1;if(lines[mid].t<=t)low=mid+1;else high=mid}const i=low-1;
 return{current:i>=0?lines[i].x:'',previous:i>0?lines[i-1].x:'',romaji:i>=0?secondaryLines[i]?.x||'':'',index:Math.max(0,i)}
}
function zoneFor(i,shape){return shape==='tall'?(i%2?'bottom':'top'):(i%2?'right':'left')}
function syncRomajiCaption(s,ls,shape,zone){
 const node=$('#romajiCaption'),text=ls.current&&ls.romaji!==ls.current?ls.romaji:'';
 if(!text){if(captionKey){node.hidden=true;captionKey=''}return}
 const key=[text,ls.index,s.size,s.centerFree,shape,innerWidth,innerHeight].join('|');if(key===captionKey)return;captionKey=key;
 node.hidden=false;node.dataset.zone=zone;
 const width=s.centerFree&&shape==='wide'?innerWidth*.32:innerWidth*.88,height=s.centerFree&&shape==='tall'?innerHeight*.065:innerHeight*.14;
 const font=Math.max(9,Math.min((Number(s.size)||64)*.48,48,Math.sqrt(width*height/(Math.max(1,[...text].length)*.8))));
 node.style.fontSize=font.toFixed(2)+'px';
 if(node.textContent!==text){node.textContent=text;node.getAnimations().forEach(a=>a.cancel());node.animate([{opacity:0},{opacity:1}],{duration:180,easing:'ease-out'})}
}
const foliaCenterTargets=[
 {effects:['classic','cadenza','partita','tilt'],selector:'#root div[class*="h-[70vh]"][class*="pointer-events-none"]'},
 {effects:['cappella'],selector:'#root div[class*="relative z-10 flex h-full w-full items-start justify-center"]'},
 {effects:['still'],selector:'#root div[class*="absolute inset-0 z-0 flex flex-col items-center justify-center"]'},
];
function makeFoliaCenterCSS(){
 const css=[];
 for(const target of foliaCenterTargets)for(const effect of target.effects){
  const root=`html[data-mk-effect="${effect}"][data-mk-center-free="on"]`;
  for(const zone of ['left','right']){
   const side=zone==='left'?'0 auto 0 0':'0 0 0 auto';
   const scoped=`${root}[data-mk-shape="wide"][data-mk-zone="${zone}"] ${target.selector}`;
   css.push(`${scoped}{position:fixed!important;inset:${side}!important;width:36vw!important;height:100vh!important;max-width:36vw!important;padding:2vw!important;z-index:20!important;overflow:hidden!important;transform:none!important}`);
   css.push(`${scoped},${scoped} *{white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important}`);
   if(target.effects.includes('classic'))css.push(`${scoped}>div{width:50%!important;max-width:50%!important;min-height:0!important;justify-content:center!important;text-align:center!important}`);
   css.push(`${scoped} [class~="whitespace-nowrap"]{max-width:100%!important;min-width:0!important;flex-shrink:0!important;margin:0 .08em!important;font-size:var(--mk-zone-font,40px)!important}`);
  }
  for(const zone of ['top','bottom']){
   const edge=zone==='top'?'0 0 auto 0':'auto 0 0 0';
   const scoped=`${root}[data-mk-shape="tall"][data-mk-zone="${zone}"] ${target.selector}`;
   css.push(`${scoped}{position:fixed!important;inset:${edge}!important;width:100vw!important;height:33vh!important;max-width:none!important;padding:2vh 4vw!important;z-index:20!important;overflow:hidden!important;transform:none!important}`);
   css.push(`${scoped},${scoped} *{white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important}`);
   if(target.effects.includes('classic'))css.push(`${scoped}>div{width:50%!important;max-width:50%!important;min-height:0!important;justify-content:center!important;text-align:center!important}`);
   css.push(`${scoped} [class~="whitespace-nowrap"]{max-width:100%!important;min-width:0!important;flex-shrink:0!important;margin:0 .08em!important;font-size:var(--mk-zone-font,40px)!important}`);
  }
 }
 return css.join('');
}
const foliaCenterCSS=makeFoliaCenterCSS();
function syncFoliaCenter(s,shape,zone){
 const text=lineState(s).current,units=Math.max(1,[...text].reduce((n,ch)=>n+(/[\u2e80-\uffff]/.test(ch)?1:.65),0));
 const safeW=shape==='wide'?innerWidth*.16:innerWidth*.46,safeH=shape==='wide'?innerHeight*.43:innerHeight*.13;
 const fit=Math.max(8,Math.min((Number(s.size)||64)*.625,56,Math.sqrt(safeW*safeH/(units*1.4))));
 try{const d=foliaFrame.contentDocument;if(!d)return;syncFont(s,d);const root=d.documentElement;const px=fit.toFixed(2)+'px';if(root.style.getPropertyValue('--mk-zone-font')!==px)root.style.setProperty('--mk-zone-font',px);const values={mkCenterFree:s.centerFree&&!s.counting&&!s.mc&&!!s.lrc?'on':'off',mkShape:shape,mkZone:zone,mkEffect:String(s.effect||'').replace(/^folia-/,'')};for(const [k,v] of Object.entries(values))if(root.dataset[k]!==v)root.dataset[k]=v;let st=d.getElementById('manokara-center-free-style');if(!st){st=d.createElement('style');st.id='manokara-center-free-style';d.head.appendChild(st)}const color=s.background||'#00ff00';const bgRule=s.transparent!==false?'html,body,#root,#root>div{background-color:transparent!important}':`html,body,#root,#root>div{background-color:${color}!important}`;const css=foliaCenterCSS+bgRule;if(st.textContent!==css)st.textContent=css}catch(e){}
}
foliaFrame.addEventListener('load',()=>{foliaLayoutKey='';if(state)render()});
const parseLyrics=(raw,duration)=>ManokaraCore.parseLyrics(raw,duration).lines;
function render(){
 const s=state;
 if(!s){return}
 const effect=String(s.effect||'clean'),body=document.body;
 const shape=centerShape(s),ls=lineState(s),activeZone=zoneFor(ls.index,shape),centerOn=s.centerFree&&!s.counting&&!s.mc&&!!s.lrc;
 const nextSceneKey=[effect,shape,centerOn,s.colorTheme,s.transparent,s.background,s.foreground,s.font,s.bold,s.size,s.googleFont].join('|');
 if(nextSceneKey!==sceneKey){sceneKey=nextSceneKey;
 body.dataset.centerFree=centerOn?'on':'off';body.dataset.centerShape=shape;
 const theme=themes[s.colorTheme];body.style.background=s.transparent===false?(s.background||'#00ff00'):'transparent';body.style.color=theme?.color||s.foreground||'#ffffff';foliaFrame.style.background=s.transparent===false?(s.background||'#00ff00'):'transparent';foliaFrame.style.filter=theme?.filter||'none';
 body.style.fontFamily=s.font||'system-ui,"Yu Gothic",sans-serif';body.style.fontWeight=s.bold===false?400:800;
 body.style.fontSize=Math.max(24,Math.min(160,Number(s.size)||64))+'px';
 syncFont(s);
 }
 if($('#current').dataset.zone!==activeZone){$('#current').dataset.zone=activeZone;$('#previous').dataset.zone=zoneFor(ls.index-1,shape)}
 syncRomajiCaption(s,ls,shape,activeZone);
 if(effect.startsWith('folia-')&&foliaFrame.dataset.mode!==effect){foliaFrame.dataset.mode=effect;foliaFrame.src='./manokara-folia.html?mode='+encodeURIComponent(effect)+(relayRoom?'&room='+encodeURIComponent(relayRoom):'')+(relayViewToken?'#view='+encodeURIComponent(relayViewToken):'');foliaLayoutKey=''}
 const foliaMode=effect.startsWith('folia-')&&!s.counting&&!s.mc&&!!s.title&&!!s.lrc;
 if(foliaMode){
  body.dataset.folia='on';jizuraCanvas.style.display='none';body.dataset.jizura='off';
  const layoutKey=[sceneKey,ls.current,activeZone,innerWidth,innerHeight].join('|');if(layoutKey!==foliaLayoutKey){foliaLayoutKey=layoutKey;syncFoliaCenter(s,shape,activeZone)}
  return;
 }
 body.dataset.folia='off';
 if(effect==='jizura'&&window.ManokaraJizura){
  if(window.ManokaraJizura.draw(jizuraCanvas,{...s,time:clock.time(),sampledAt:Date.now()})){jizuraCanvas.style.display='block';body.dataset.jizura='on';return}
 }
 jizuraCanvas.style.display='none';body.dataset.jizura='off';
 let current=ls.current,previous=ls.previous,count='';
 if(s.counting){
  current=s.title||'';previous='';
  const remaining=clock.countdown();
  count=String(Math.max(1,Math.ceil(remaining)));
 }else if(s.mc){
  current=s.memo||'MC break';previous='';
 }
 $('#previous').textContent=previous;$('#count').textContent=count;
 const shown=current||'';
 const textKey=[s.title||'',shown,s.mc?'mc':'',s.counting?'count':'',effect].join('|');
 const currentNode=$('#current');
 if(textKey!==lastTextKey){currentNode.textContent=shown;window.ManokaraLyricFX.play(currentNode,shown,effect);lastTextKey=textKey}
}
function clearOutput(message=''){
 state=null;lastTextKey='';sceneKey='';foliaLayoutKey='';captionKey='';$('#romajiCaption').hidden=true;$('#romajiCaption').textContent='';document.body.dataset.centerFree='off';$('#current').className='';$('#current').textContent=message;
 $('#previous').textContent='';$('#count').textContent='';document.body.dataset.folia='off';document.body.dataset.jizura='off';jizuraCanvas.style.display='none';
 for(const fn of subscribers)fn({ready:false});
}
function acceptState(next,delay=0){if(next&&next.ready!==false){state=clock.accept(next,performance.now(),delay);notify();render()}else clearOutput()}
const parentFeed=(()=>{try{if(parent!==window)return new URL(location.href).searchParams.get('preview')==='1'?parent.ManokaraPreview:parent.ManokaraOutput}catch(_){}return null})();
if(parentFeed){const unsubscribe=parentFeed.subscribe(next=>acceptState(next,0));window.addEventListener('pagehide',unsubscribe,{once:true})}
else if(!new URL(location.href).searchParams.has('preview')){
const relay=ManokaraRelay.connect({url:relayStateUrl(),token:relayViewToken,
 receive(next,delay){if(performance.now()-directAt>750)acceptState(next,delay)},
 revoked(){viewerRevoked=true;directAt=-Infinity;clearOutput('OBS link expired or revoked. Copy a new link from Manokara.')}});
try{const channel=new BroadcastChannel('manokara-live-'+relayRoom+'-'+relayViewToken);channel.onmessage=({data})=>{if(viewerRevoked||!data?.snapshot)return;directAt=performance.now();acceptState(data.snapshot,Math.max(0,Math.min(200,Date.now()-Number(data.sentAt||Date.now()))))};window.addEventListener('pagehide',()=>channel.close(),{once:true})}catch(_){}
}
function animate(){if(!document.hidden)render();requestAnimationFrame(animate)}
requestAnimationFrame(animate);setInterval(()=>{if(document.hidden)render()},200);
</script>
</body>
</html>
