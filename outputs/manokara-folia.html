    <script>
      (() => {
        const nativeFetch = window.fetch.bind(window);
        let trackKey = '', stableTime = 0, stableEffect = '', pendingEffect = '', pendingEffectAt = 0, wasPlaying = false;
        window.fetch = async (...args) => {
          const requestUrl = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
          const parsedUrl = new URL(requestUrl, location.href);
          if (parsedUrl.pathname === '/__lyric-state') {
            const room = new URL(location.href).searchParams.get('room');
            if (room) { parsedUrl.searchParams.set('room', room); args[0] = parsedUrl.href; }
            const token = new URLSearchParams(location.hash.slice(1)).get('view');
            const options = {...(args[1] || {}), credentials: 'omit'};
            const headers = new Headers(options.headers);
            if (token) headers.set('Authorization', 'Bearer ' + token);
            args[1] = {...options, headers};
          }
          const response = await nativeFetch(...args);
          try {
            if (new URL(requestUrl, location.href).pathname !== '/__lyric-state') return response;
            const snapshot = await response.clone().json();
            if (!snapshot || typeof snapshot !== 'object' || snapshot.ready !== true) return response;
            const nextEffect = String(snapshot.effect || 'clean');
            if (!stableEffect) stableEffect = nextEffect;
            else if (nextEffect === stableEffect) {
              pendingEffect = '';
              pendingEffectAt = 0;
            } else if (nextEffect !== pendingEffect) {
              pendingEffect = nextEffect;
              pendingEffectAt = performance.now();
            } else if (performance.now() - pendingEffectAt >= 500) {
              stableEffect = nextEffect;
              pendingEffect = '';
              pendingEffectAt = 0;
            }
            snapshot.effect = stableEffect;
            // The parent owns visualizer changes and replaces this frame. Keep the
            // mounted Pixi scene stable until navigation to avoid teardown/ticker races.
            const frameEffect = new URL(location.href).searchParams.get('mode');
            if (/^folia-(classic|cadenza|partita|fume|cappella|tilt|claddagh|monet|diorama|pendolo|sonnet|tempera|lumiere)$/.test(frameEffect || '')) snapshot.effect = frameEffect;
            const nextTrack = [snapshot.title || '', snapshot.lrc || '', snapshot.duration || 0].join('|');
            let nextTime = Number(snapshot.time) || 0;
            const isPlaying = !!snapshot.playing && !snapshot.paused;
            if (nextTrack !== trackKey || !isPlaying || !wasPlaying) {
              trackKey = nextTrack;
              stableTime = nextTime;
            } else if (nextTime < stableTime && stableTime - nextTime <= 0.35) {
              nextTime = stableTime;
            } else {
              stableTime = nextTime;
            }
            wasPlaying = isPlaying;
            snapshot.time = nextTime;
            return new Proxy(response, {
              get(target, property) {
                if (property === 'json') return async () => snapshot;
                const value = Reflect.get(target, property, target);
                return typeof value === 'function' ? value.bind(target) : value;
              }
            });
          } catch (_) {
            return response;
          }
        };
      })();
