  <body>
    <div id="root"></div>
    <script src="./manokara-core.js"></script>
<script src="./manokara-relay.js"></script>
<script>
      (() => {
        const room=new URL(location.href).searchParams.get('room')||'';
        try{if(parent!==window&&parent.ManokaraOutput?.room===room){window.ManokaraFoliaSource=parent.ManokaraOutput;return}}catch(_){}
        const clock=ManokaraCore.createClock(),listeners=new Set();
        const token=new URLSearchParams(location.hash.slice(1)).get('view')||'';
        let state={ready:false};
        window.ManokaraFoliaSource={time:()=>clock.time(),getSnapshot:()=>state,audio:()=>state.playing&&!state.paused&&clock.age()<1000?state:null,subscribe(fn){listeners.add(fn);fn(state);return()=>listeners.delete(fn)}};
        const notify=()=>{for(const fn of listeners)fn(state)};
        ManokaraRelay.connect({url:'/__lyric-state?room='+encodeURIComponent(room),token,
          receive(next,delay){state=next.ready===false?next:clock.accept(next,performance.now(),delay);notify()},
          revoked(){state={ready:false};notify()}});
      })();
    </script>
